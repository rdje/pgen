[package]
name = "pgen"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["EBNF Parser Generator Project"]
description = "Rust implementation of EBNF AST transformation pipeline"
license = "MIT"

[lib]
name = "pgen"
path = "src/lib.rs"

[[bin]]
name = "ast_pipeline"
path = "src/main.rs"
required-features = ["normal"]

[[bin]]
name = "ast_pipeline_bootstrap"
path = "src/main.rs"
required-features = ["bootstrap"]

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "perf_bench"
path = "src/bin/perf_bench.rs"
required-features = ["generated_parsers"]

[[bin]]
name = "regex_perf_probe"
path = "src/bin/regex_perf_probe.rs"
required-features = ["generated_parsers"]

[[bin]]
# PGEN-RGX-0078 verification probe. Mirrors `regex_perf_probe` but measures
# via `pgen::embedding_api::parse_grammar_profile_named("regex",
# "regex_default", input)` — the embedding-API path RGX measured in their
# 2026-05-01 ratio table. Used to quantify the cached-worker dispatch
# overhead vs the direct `RegexParser::parse_full_regex()` path.
name = "regex_perf_probe_embedding_api"
path = "src/bin/regex_perf_probe_embedding_api.rs"
required-features = ["generated_parsers"]

[[bin]]
# PGEN-RGX-0078 microbench: measures validate_regex_compile_contract cost
# in isolation on the 8-pattern bench corpus to decide whether the
# 11-pass validation pipeline is worth short-circuiting.
name = "regex_validation_microbench"
path = "src/bin/regex_validation_microbench.rs"

[[bin]]
name = "ebnf_dual_run_diff"
path = "src/bin/ebnf_dual_run_diff.rs"
required-features = ["ebnf_dual_run"]

[[bin]]
name = "parseability_probe"
path = "src/bin/parseability_probe.rs"
required-features = ["generated_parsers"]

[[bin]]
name = "regex_corpus_probe"
path = "src/bin/regex_corpus_probe.rs"
required-features = ["generated_parsers"]

[[bin]]
name = "rtl_frontend_generated_contract_probe"
path = "src/bin/rtl_frontend_generated_contract_probe.rs"
required-features = ["generated_parsers"]

[[bin]]
name = "coverage_gap_triage"
path = "src/bin/coverage_gap_triage.rs"

[[bin]]
# Slice 3 / M2 differential validation gate. Compares the regex
# parser hook's typed entry methods to the legacy +
# `ParseContent::to_json_value()` reference path byte-for-byte across
# the PGEN-RGX-0073 bug-corpus patterns. Requires the regex parser to
# have been regenerated with the regex hook registered (use the
# maintained `regex_typed_differential_gate` make target which
# handles regen, build, run, and restore in one shot).
name = "regex_typed_differential_gate"
path = "src/bin/regex_typed_differential_gate.rs"
required-features = ["regex_typed_differential_gate"]

[[bin]]
# Slice 4 typed-path perf probe. Mirrors `regex_perf_probe` but calls
# `parser.parse_regex_typed()` instead of `parser.parse_full_regex()`,
# so subsequent shape-typed-emit optimization slices have a direct
# apples-to-apples measurement target for the JSON-producing path.
# Requires the regex parser to have been regenerated with the regex
# hook registered; the maintained `regex_typed_perf_probe` make target
# handles regen, build, run, and restore in one shot.
name = "regex_typed_perf_probe"
path = "src/bin/regex_typed_perf_probe.rs"
required-features = ["regex_typed_perf_probe"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
rand = "0.8"
regex = "1.7"
regex-syntax = "0.8"
syn = { version = "2.0", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2.37"
lazy_static = "1.4"
rustfmt-wrapper = "0.2.1"
# Optim #6 (PGEN-RGX-0073): rustc-hash (FxHash) for the parser's memo HashMap. The
# memo is hit on every rule entry; default siphash is overkill for internal
# (RuleId, position) integer keys with no DoS exposure. FxHash is the same hasher
# rustc uses internally — small crate, no transitive deps, ~3-4× faster on small
# integer keys per the standard rustc-hash benchmarks.
rustc-hash = "2.1"
# mimalloc as the perf-probe global allocator — LANDED (RGX-0078.5.i.7 `-0097`,
# the recommended-production allocator). macOS's libsystem_malloc + `_xzm_free`
# dominate the value/alloc self-time; MEASURED −29.2% vs system malloc (fat-LTO
# alternated 5×2000 geomean-of-mins, deterministic), capturing 73% of the
# never-free bump-arena ceiling. Kept OPTIONAL (non-default) BY DESIGN: a
# library must NOT impose a `#[global_allocator]` on its consumers, so mimalloc
# is not pulled into the pgen lib / downstream (RGX) dependency tree; the perf
# probe opts in via `mimalloc_perf` (the standard closure-bench config) and the
# regex integration contract recommends a mimalloc-class allocator to embedders.
mimalloc = { version = "0.1", default-features = false, optional = true }
typed-arena = "2.0.2"
# RGX-0078.5.i.14 (C3): inline-small storage for the fused cascade's thin-memo
# derivation segments. The overwhelming majority of committed sub-derivations
# are a handful of POD `DerivEvent`s + 0–1 boundary refs, so a `SmallVec` inline
# capacity elides the per-success `Vec` malloc pair (and its free). Tiny,
# no-transitive-deps utility crate in the spirit of `rustc-hash`; unlike the
# mimalloc allocator it is a plain data-structure dep, so it imposes no global
# state on consumers (the README allocator architecture is unaffected).
smallvec = "1"

[features]
default = ["normal"]
normal = []
bootstrap = []
generated_parsers = []
ebnf_dual_run = []
mimalloc_perf = ["dep:mimalloc"]
# RGX-0078.5.i.7 STEP-0 part (a): the never-free (reset-per-sample) bump arena
# global allocator in `regex_perf_probe`. Measurement-only: it prices the
# FALSIFIABLE CEILING of killing the value/alloc complex (RE-PROFILE #11:
# allocator ~41% + `_xzm_free` ~21.5% of self-time) by making every in-parse
# `malloc` a pointer bump and every `free` a no-op. Mutually exclusive with
# `mimalloc_perf` (both set `#[global_allocator]`). No extra deps — std System.
never_free_arena_perf = []
# Slice 3 / M2 differential validation gate. Enables the
# `regex_typed_differential_gate` binary to reference
# `parser.parse_regex_typed()`. The typed methods only exist when the
# regex parser was regenerated with the regex hook registered (i.e.
# under `--enable-parser-hooks`); the maintained
# `make regex_typed_differential_gate` target handles regen + build +
# run + restore so adopters don't have to wire it manually.
regex_typed_differential_gate = ["generated_parsers"]
# Slice 4 typed-path perf probe. Same shape as
# `regex_typed_differential_gate` (the typed methods only exist when
# the regex parser was regenerated with the regex hook registered).
# The maintained `make regex_typed_perf_probe` target handles regen +
# build + run + restore.
regex_typed_perf_probe = ["generated_parsers"]

# RGX-0078.4.a (SPEED PHASE): free AOT build-flag wins. The release build
# previously used cargo DEFAULTS (`lto = false`, `codegen-units = 16`), which
# fragments the crate into 16 independently-optimized units with no cross-unit
# inlining and blocks cross-crate inlining. PGEN's generated recursive-descent +
# packrat parser is branchy native code that benefits directly from whole-program
# optimization. `lto = "fat"` + `codegen-units = 1` is a classic 5-20% win on
# compute-heavy native code, is parser-AGNOSTIC (every release binary/grammar
# inherits it), machine-INDEPENDENT (reproducible, unlike target-cpu/PGO), and
# correctness-neutral by construction (a build-profile setting cannot change
# program semantics). Cost: slower release builds. Measured before->after via
# `regex_perf_probe` geomean-of-mins with the full correctness oracle battery
# re-run byte-identical. See docs/tasks/RGX-0078.md leaf .4.a.
[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
