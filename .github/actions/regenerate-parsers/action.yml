name: Regenerate the generated parsers
description: >-
  Materialise the untracked generated/ tree inside a fresh checkout by replaying the
  repository's own cold-clone bootstrap. Required by every workflow whose command compiles
  the pgen crate with --features generated_parsers.

# CI-PARITY-GATE-ROT.4 — THE SINGLE HOME OF THE REGENERATION *STEP*.
#
# ⭐ WHY THIS IS LOAD-BEARING, NOT A CONVENIENCE.
# `generated/` is untracked by repository policy (`0ed2b2ad`, 2026-04-29 — "Slice 5: stop
# tracking generated/* in git"), so `actions/checkout` yields a tracked-files-only tree with
# no generated parsers at all. `rust/src/lib.rs:72,78` include the two annotation parsers by
# LITERAL path with no `has_generated_*` cfg, so under `--features generated_parsers` their
# absence is a hard rustc error — `error: couldn't read src/../../generated/…` → `could not
# compile pgen (lib)` — rather than a disabled feature.
#
# ⭐ THE ORDERING ACCIDENT THAT HID IT FOR 1,371 COMMITS. Hosted auto-triggers were paused
# `af85a5fd` (2026-04-14) and `generated/` was untracked `0ed2b2ad` (2026-04-29) — fifteen
# days apart, in that order — so the breaking change landed when there was no automatic run
# left to fail. Measured by CI-PARITY-GATE-ROT.3 against the identical tracked-files-only
# shape: 8 of 11 replayed workflow commands died on exactly this, and by `.4`: 11 of the 15
# tracked workflows need this step.
#
# ⛔ The SEQUENCE itself is NOT defined here — it lives in exactly one place,
# `rust/Makefile`'s `regenerate_generated_parsers` target, which the local workflow-parity
# gate (`prepare_generated_artifacts` in `rust/scripts/ci_workflow_local_gate.sh`) also calls.
# A composite action cannot be used from a shell gate, and a make target cannot carry a step
# name — so the action owns the STEP and the make target owns the RECIPE, one definition each.
#
# Measured cost from a bare tracked tree: ~258 s.
#
# `audit_workflow_regeneration_surface` in the local parity gate fails when a workflow that
# runs a `make -C rust` gate does not reference this action, so this cannot silently regress.

runs:
  using: composite
  steps:
    - name: Regenerate the generated parsers
      shell: bash
      run: |
        set -euo pipefail
        make -C rust SHELL=/bin/bash regenerate_generated_parsers
