name: generated-clippy-correctness-gate

# GENERATED-LINT-CORRECTNESS.3 — hold the generated-parser clippy::correctness floor at 0.
#
# ⛔ This gate REFUSES (exit 2) rather than passing when the generated/ tree is absent, and
# generated/ is untracked by repository policy — so a bare checkout CANNOT run it. The
# regeneration step below is therefore load-bearing, not a convenience: without it the job
# would report a refusal, which is the correct behaviour but not a useful signal.
#
# Hosted workflows are manual-only (workflow_dispatch) while the Actions-minutes pause is in
# effect; the local lane is `make -C rust SHELL=/bin/bash generated_clippy_correctness_gate`.

on:
  workflow_dispatch:

jobs:
  generated-clippy-correctness-gate:
    name: generated-clippy-correctness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # generated/ is untracked; seed the ebnf bootstrap then emit every parser the contract
      # marks required. Without this the gate refuses (which is correct, but proves nothing).
      - name: Regenerate the generated parsers
        run: |
          set -euo pipefail
          make -C rust SHELL=/bin/bash regex_parser_bootstrap
          make -C rust SHELL=/bin/bash annotation_parsers
          for g in json regex systemverilog systemverilog_preprocessor vhdl rtl_const_expr rtl_frontend; do
            make -C rust SHELL=/bin/bash "focus_${g}"
          done

      - name: Run generated-parser clippy correctness gate
        run: make -C rust SHELL=/bin/bash generated_clippy_correctness_gate

      - name: Upload generated clippy correctness artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-clippy-correctness-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rust/target/generated_clippy_correctness_gate/summary.txt
            rust/target/generated_clippy_correctness_gate/correctness_findings.txt
            rust/target/generated_clippy_correctness_gate/build_script_cfgs.txt
            rust/target/generated_clippy_correctness_gate/live_correctness_roster.txt
          if-no-files-found: warn
          retention-days: 14
