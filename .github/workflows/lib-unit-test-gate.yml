name: lib-unit-test-gate

# ⛔⛔ WHY THIS WORKFLOW EXISTS (ENGINE-UNIVERSAL-SERVICES.46 (d) / .49).
# Until 2026-08-25, NO CI workflow, NO doctrine enforcer and NO gate — the flagship aggregate
# included — ran the crate's own unit-test suite. Four of its ~1 130 tests were RED on HEAD when
# that was first measured; three had shipped one commit earlier from the very leaf that changed
# their subject, INCLUDING the green control of the arm it changed, and a fourth had been red for
# 403 commits and 25 days. `lib_unit_test_gate` closed that at the pre-push cadence as a REQUIRED
# check of `sota_exit_gate`; this workflow is the hosted lane for the same target.
#
# ⛔⛔⛔ TRIGGER: `workflow_dispatch:` + `push:` — AND THE `push:` HALF WAS ADDED ONLY AFTER THE
# OBJECTION TO IT WAS MEASURED AWAY. This file shipped dispatch-only one commit earlier
# (`PGEN-ENGINE-UNIVERSAL-SERVICES-0087`) because two things stood against the automatic lane, and
# both have since been settled by measurement rather than by argument:
#
#   1. THE SPEND. `docs/reference/PGEN_RELEASE_POLICY.md` published a billing-control policy —
#      "Hosted GitHub Actions auto-runs are paused to conserve account Actions minutes". MEASURED
#      against the account's own runs: `gh api /repos/rdje/pgen/actions/runs/31783006358/timing`
#      returns `billable.UBUNTU.total_ms = 0` for a 103-second run. `pgen` is a PUBLIC repository
#      and these are standard runners, so the minutes are free. The director confirmed the policy
#      was written while the repository was PRIVATE; it has since been made public, so the premise
#      is simply stale. ⇒ the spend objection is VOID, not overruled.
#   2. THE RED. `DONE-BAR.4` scoped the automatic tier to the gates needing no regeneration, and at
#      the time this file was written the automatic tier's only doctrine lane had been FAILING on
#      `main` for 11 days (`CI-PARITY-GATE-ROT.47` — a macOS-Homebrew absolute path in
#      `rust/Makefile`'s SHELL that killed every `make` target on Linux). Adding a lane to a tier
#      whose existing red nobody was reading would have been the exact failure mode `.49` warned
#      about. That red is FIXED first, in the preceding commit.
#
# ⛔⛔ THIS BREAKS AN INVARIANT THIS PROJECT PUBLISHED TWO COMMITS AGO, AND THAT IS DELIBERATE.
# `docs/book/src/gate-flow.md` stated: "the automatic tier is EXACTLY the subset that needs no
# regeneration — 12 dispatch-only and all 12 regenerate; 4 auto-triggered and none does, coinciding
# with no exceptions." That was TRUE when written and is FALSE the moment this trigger lands. It is
# corrected in the same commit, because the coincidence was never a design rule — it was a
# consequence of a COST constraint that no longer bills. A published invariant left standing after
# the thing it describes changes is an active falsehood.
#
# ⚠️ AND THE FIRST RUN OF THIS WORKFLOW IS ALSO THE FIRST HOSTED TEST OF REGENERATION ITSELF.
# Measured 2026-08-25 via `gh run list`: of every hosted run this repository has ever had, NOT ONE
# carried the regeneration composite action — the four auto-triggered lanes are all cheap ones. So
# a red first run means "hosted regeneration is unproven", not "the unit suite regressed", and it
# must be read that way. Nothing is blocked by it either way: `rust/config/branch_protection_policy.json`
# has `required_status_checks: []`, so this lane REPORTS and never gates a merge.
#
# ⭐ MEASURED PRICE, end-to-end 2026-08-25, by replaying this workflow's exact command through
# `ci_workflow_local_gate` against a `git ls-files`-only export tree — regeneration, cold build and
# the full suite, which is what a hosted runner does: 952 s (15.9 min), exit 0, peak tree RSS
# 10 943 MB. That is PER PUSH EVENT, not per commit, and this repository's push cadence is 300
# commits ⇒ roughly one ~16-minute free run per push.
# ⚠️ HONEST BOUND on the memory figure: ~10.9 GB peak is a real hosted-runner constraint. It is NOT
# introduced here — all 12 tracked workflows that regenerate carry the same step — and a PUBLIC
# repository's standard `ubuntu-latest` runner provides 16 GB, so it fits with headroom. It has
# still never been observed on a runner, which is precisely what the first run establishes.
#
# ⚠️ `pull_request:` is deliberately OMITTED for the reason the three existing automatic lanes give
# verbatim: this repository has 0 merge commits in its entire history, so a PR trigger would fire
# never, and wiring that makes nothing run is theatre.

on:
  workflow_dispatch:
  push:

jobs:
  lib-unit-test-gate:
    name: lib-unit-test-gate
    runs-on: ubuntu-latest
    # 60 per `.49`'s ruling. The regeneration-surface audit enforces a FLOOR of 30 for any job
    # carrying the regeneration step (`ci_workflow_local_gate.sh`), and the measured cost above
    # sits well inside this budget.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # generated/ is untracked, so actions/checkout yields a tree with no generated parsers and
      # this job's gate cannot compile the crate. Recipe: rust/Makefile's
      # regenerate_generated_parsers (CI-PARITY-GATE-ROT.4). ⭐ That path was BROKEN from
      # 2026-08-11 to 2026-08-25 — one E0425 on a bare checkout — which is why `.49` was blocked on
      # `CI-PARITY-GATE-ROT.40` and could not ship this workflow green. It is now proven end-to-end
      # from a tracked-files-only tree (`.46`), and guarded by `make -C rust cold_clone_build_gate`.
      - name: Regenerate the generated parsers
        uses: ./.github/actions/regenerate-parsers

      - name: Run the crate unit-test suite
        run: make -C rust SHELL=/bin/bash lib_unit_test_gate

      - name: Upload cargo test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lib-unit-test-gate-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/generated_logs
          if-no-files-found: warn
          retention-days: 14
