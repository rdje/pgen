name: branch-protection-contract-gate

on:
  workflow_dispatch:
  # AUTOMATIC LANE (DONE-BAR.4, director-approved 2026-07-30 session #227). This is one of the three
  # gate targets that need NO `generated/` regeneration, so it can run on a bare checkout. Enabled to
  # move the AUTOMATIC tier over the make gate targets off ZERO — `CI-PARITY-GATE-ROT.6` measured it at
  # zero and escalated the spend as a director call; this is that call executed on the cheap subset.
  # ⛔ `pull_request:` is deliberately OMITTED: this repository has **0 merge commits** in its entire
  # history, so a PR trigger would fire never — and wiring that makes nothing run is the theatre `.6`
  # rejected. Add it deliberately if the project adopts PRs.
  push:

jobs:
  branch-protection-contract-gate:
    name: branch-protection-contract-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure jq runtime
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y jq
            jq --version
          fi

      - name: Run branch protection contract gate
        run: make -C rust SHELL=/bin/bash branch_protection_contract_gate

      - name: Upload branch protection contract artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: branch-protection-contract-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/branch_protection_contract_gate
          if-no-files-found: warn
          retention-days: 14
