name: memory-architecture-gate

# E4 — THE AUTOMATIC DOCTRINE LANE (the un-bypassable backstop; DOCTRINE_ENFORCEMENT.md §9).
#
# This is the ONLY workflow still triggered by `push` + `pull_request`; the other 14 are
# `workflow_dispatch`-only to conserve account Actions minutes. It therefore carries the whole
# automatic tier of doctrine enforcement, and it runs the SAME registry driver the local
# pre-commit hook runs, so `git commit --no-verify` does not reach CI.
#
# ⭐ IT INVOKES THE DRIVER, NEVER INDIVIDUAL ENFORCERS (CI-PARITY-GATE-ROT.15, 2026-07-29).
# It used to name five of them. MEASURED: that left 8 of the 13 registered doctrines with no
# automatic lane at all — and, the part that matters, a doctrine added tomorrow silently got
# none (`ROUTING-EVIDENCE`, registered hours earlier, was already in exactly that position).
# Naming enforcers freezes the roster at whatever was last typed into this file. The registry
# is the single source of the roster, so calling the driver makes a new doctrine inherit this
# lane by construction. `FLOW-INTEGRITY` invariant (8) fails the build if this regresses.
#
# ⚠️ The workflow name is historical: it was the MEMORY-ARCH E4 gate and is now the whole
# doctrine lane. Deliberately NOT renamed — the name is referenced in ~15 tracked places
# including a pinned ground-truth control in `scripts/check_gate_reachability.sh`, and a
# cosmetic rename is not worth perturbing a calibration control.

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  memory-architecture-gate:
    name: memory-architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run every enforced doctrine (registry driver — E4)
        # Single source of truth for the roster. ~2 s: file reads and greps, no cargo, no
        # build, no network. Exits nonzero on any breach, so a non-compliant branch fails
        # the build and cannot merge.
        run: bash scripts/check_doctrines.sh

      - name: State which doctrines could NOT be evaluated here
        # ⭐ *A check that cannot run must SAY SO, not return green* — this tree's founding
        # principle, applied to its own lane. Several enforcers judge the STAGED diff; a
        # hosted push has no index, so they exit 0 having evaluated nothing, and a green tick
        # would otherwise imply they were satisfied. The driver derives and prints that list
        # itself (one home) — this step surfaces it in the log even when the gate passes.
        if: always()
        run: bash scripts/check_doctrines.sh 2>&1 | sed -n '/^scope:/,$p'

      - name: Validate commit subjects carry an identifier-shaped leading token (E3 mirror)
        # Permissive by design (see the notes in the memory-architecture enforcer): pgen
        # subject styles are varied; this rejects only blank/garbage-led subjects. Not a
        # registered doctrine — it has no enforcer script, so it lives inline here.
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then range="$base..HEAD"; else range="HEAD~1..HEAD"; fi
          bad=0
          while IFS= read -r s; do
            printf '%s' "$s" | grep -Eq '^[A-Za-z][A-Za-z0-9._-]+' || { echo "non-compliant subject: $s" >&2; bad=1; }
          done < <(git log --format='%s' "$range" 2>/dev/null || true)
          exit $bad
