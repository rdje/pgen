name: sota-exit-gate

on:
  workflow_dispatch:

jobs:
  sota-exit-gate:
    name: sota-exit-gate
    runs-on: ubuntu-latest
    # ⭐⭐ CI-PARITY-GATE-ROT.4/.6 — was 60, and that was NEVER survivable. `.3`'s prepared census
    # measured this aggregate at 8,587 s (2 h 23 m) on a fast local volume — and that run FAILED
    # partway, so a green run is longer still. The flagship aggregate carried a timeout below a
    # QUARTER of its own measured cost from the day hosted triggers were paused, so nothing hit it.
    #
    # ⭐ SET TO THE PLATFORM MAXIMUM, DELIBERATELY, AND THE REASONING IS THE POINT.
    # The hosted/local slowdown factor is UNMEASURABLE while Actions are paused and billable, so any
    # value between the measured 143 minutes and the 360-minute GitHub job cap encodes a guess about
    # a number nobody has. 360 is the only figure here that is not a guess: it is what the platform
    # allows. It costs nothing extra — Actions bill minutes CONSUMED, not the budget declared — and
    # it strictly dominates the 300 it replaces, which differed from the cap only for runs between
    # 300 and 360 minutes, i.e. exactly the band this job might land in.
    #
    # ⛔ TRIGGER CONDITION, so this is a decision and not an open question: if a hosted run ever
    # reaches 360 minutes, the answer is NOT a larger number — the cap is the cap. It is that this
    # aggregate does not fit one hosted job and must be SPLIT into per-family jobs. At that point
    # the split is justified by a MEASUREMENT rather than by the speculation it would be today.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Ensure jq runtime
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y jq
            jq --version
          fi

      - name: Verify Perl runtime for SOTA dual-run surfaces
        run: perl -MJSON::PP -e 'print "Perl JSON::PP ok\n";'

      # generated/ is untracked, so actions/checkout yields a tree with no generated
      # parsers and this job's gate cannot compile the crate. Recipe: rust/Makefile's
      # regenerate_generated_parsers (CI-PARITY-GATE-ROT.4).
      - name: Regenerate the generated parsers
        uses: ./.github/actions/regenerate-parsers

      - name: Run SOTA exit aggregate gate
        env:
          PGEN_STRICT_ANNOTATION_VALIDATION: "1"
          PGEN_SOTA_POLICY_FILE: ${{ github.workspace }}/rust/config/sota_exit_policy.env
          PGEN_SOTA_RUN_EBNF_READINESS: "1"
          PGEN_SOTA_REQUIRE_EBNF_STRICT: "0"
          PGEN_SOTA_RUN_EBNF_DUAL_RUN_DIFF: "1"
          PGEN_SOTA_REQUIRE_EBNF_DUAL_RUN_STRICT: "0"
        run: make -C rust SHELL=/bin/bash sota_exit_gate

      - name: Upload SOTA gate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sota-exit-gate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rust/target/sota_exit_gate
            rust/target/fixed_point_gate
            rust/target/annotation_robustness_gate
            rust/target/differential_harness
            rust/target/performance_gate
            rust/target/ebnf_frontend_gate
            rust/target/ebnf_frontend_dual_run_gate
            rust/target/stimuli_module_parity_gate
          if-no-files-found: warn
          retention-days: 14
