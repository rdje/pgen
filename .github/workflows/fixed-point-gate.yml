name: fixed-point-gate

on:
  workflow_dispatch:
  # AUTOMATIC LANE (DONE-BAR.4, director-approved 2026-07-30 session #227). This is one of the three
  # gate targets that need NO `generated/` regeneration, so it can run on a bare checkout. Enabled to
  # move the AUTOMATIC tier over the make gate targets off ZERO — `CI-PARITY-GATE-ROT.6` measured it at
  # zero and escalated the spend as a director call; this is that call executed on the cheap subset.
  # ⛔ `pull_request:` is deliberately OMITTED: this repository has **0 merge commits** in its entire
  # history, so a PR trigger would fire never — and wiring that makes nothing run is the theatre `.6`
  # rejected. Add it deliberately if the project adopts PRs.
  push:

jobs:
  fixed-point-gate:
    name: fixed-point-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Ensure jq runtime
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y jq
            jq --version
          fi

      - name: Run fixed-point bootstrap reproducibility gate
        env:
          PGEN_STRICT_ANNOTATION_VALIDATION: "1"
        run: make -C rust SHELL=/bin/bash fixed_point_gate

      - name: Upload fixed-point drift artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fixed-point-gate-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/fixed_point_gate
          if-no-files-found: warn
          retention-days: 14
