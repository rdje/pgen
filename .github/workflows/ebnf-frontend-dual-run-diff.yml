name: ebnf-frontend-dual-run-diff

on:
  workflow_dispatch:

jobs:
  ebnf-frontend-dual-run-diff:
    name: ebnf-frontend-dual-run-diff
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Ensure jq runtime
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y jq
            jq --version
          fi

      - name: Verify Perl runtime for Perl-vs-Rust dual-run
        run: perl -MJSON::PP -e 'print "Perl JSON::PP ok\n";'

      # generated/ is untracked, so actions/checkout yields a tree with no generated
      # parsers and this job's gate cannot compile the crate. Recipe: rust/Makefile's
      # regenerate_generated_parsers (CI-PARITY-GATE-ROT.4).
      - name: Regenerate the generated parsers
        uses: ./.github/actions/regenerate-parsers

      - name: Run EBNF frontend dual-run differential (report mode)
        run: make -C rust SHELL=/bin/bash ebnf_frontend_dual_run_diff

      - name: Upload EBNF dual-run differential artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ebnf-frontend-dual-run-diff-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/ebnf_frontend_dual_run_gate
          if-no-files-found: warn
          retention-days: 14
