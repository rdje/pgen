[book]
authors = ["PGEN Project"]
language = "en"
src = "src"
title = "PGEN JSON Parser — Integration Reference (simplified built-in grammar)"

[build]
build-dir = "../json_parser_book-html"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/richarddje/pgen"
edit-url-template = "https://github.com/richarddje/pgen/edit/main/docs/json_parser_book/{path}"

[output.html.fold]
enable = true
level = 1
